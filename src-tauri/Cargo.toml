[package]
name = "pdf2md-converter"
version = "0.1.0"
description = "Private, offline PDF to Markdown conversion for research papers"
authors = ["PDF2MD Converter contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "pdf2md_converter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
